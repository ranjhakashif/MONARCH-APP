workflows:
  flutter-android-apk:
    name: Build Flutter APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Get Flutter packages
        script: |
          cd monarch-mobile || cd .
          flutter pub get
      - name: Build APK
        script: |
          cd monarch-mobile || cd .
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
